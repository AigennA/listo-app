<!doctype html>
<meta charset="utf-8">
<!--
  Google Play phone screenshot frame, 1080x1920 (9:16). Rendered by
  render-play-screenshots.ps1; the query string picks the capture and caption:
  play-screenshot.html?shot=02-my-lists&title=...&sub=...
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden}
  .stage{position:relative;width:1080px;height:1920px;overflow:hidden;box-sizing:border-box;
         padding-top:110px;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(160deg,#FBF7EF 0%,#F1E9D8 45%,#E4F1E8 100%)}
  .blob{position:absolute;border-radius:50%}
  .b1{width:760px;height:760px;left:-260px;top:-300px;background:rgba(183,228,199,.55)}
  .b2{width:560px;height:560px;right:-200px;bottom:-160px;background:rgba(244,162,89,.20)}
  .b3{width:300px;height:300px;right:80px;top:-90px;background:rgba(64,145,108,.12)}
  h1{position:relative;margin:0;max-width:940px;text-align:center;color:#1B4332;
     font-family:'Poppins',system-ui,sans-serif;font-weight:700;font-size:64px;line-height:1.1;letter-spacing:-1px;white-space:pre-line}
  p{position:relative;margin:20px 0 0;max-width:900px;text-align:center;color:#2D6A4F;
    font-family:'Poppins',system-ui,sans-serif;font-weight:500;font-size:34px;line-height:1.35}
  .phone{position:relative;margin-top:56px;padding:14px;border-radius:64px;background:#1B1B1F;
         box-shadow:0 30px 70px rgba(27,67,50,.30)}
  .phone img{display:block;height:1440px;border-radius:50px}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="phone"><img id="shot" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('shot').src = '../screenshots/phone-en/' + (q.get('shot') || '02-my-lists') + '.png';
</script>
