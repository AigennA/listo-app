<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden}
  .stage{position:relative;width:1024px;height:500px;
         background:linear-gradient(135deg,#FBF7EF 0%,#F1E9D8 45%,#E4F1E8 100%);
         display:flex;align-items:center;gap:56px;padding:0 84px;box-sizing:border-box}
  .blob{position:absolute;border-radius:50%;filter:blur(2px)}
  .b1{width:420px;height:420px;left:-120px;top:-160px;background:rgba(183,228,199,.55)}
  .b2{width:300px;height:300px;right:-80px;bottom:-120px;background:rgba(244,162,89,.22)}
  .b3{width:180px;height:180px;right:230px;top:-70px;background:rgba(64,145,108,.14)}
  .badge{position:relative;width:212px;height:212px;border-radius:64px;flex:0 0 auto;
         background:linear-gradient(135deg,#40916C,#1B4332);
         box-shadow:0 18px 40px rgba(27,67,50,.28)}
  .copy{position:relative}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:104px;line-height:1;
     margin:0;color:#1B4332;letter-spacing:-1px}
  p.tag{font-family:'Poppins',system-ui,sans-serif;font-weight:500;font-size:34px;
        margin:16px 0 0;color:#2D6A4F}
  ul{list-style:none;margin:26px 0 0;padding:0;display:flex;gap:12px}
  li{font-family:'Poppins',system-ui,sans-serif;font-weight:500;font-size:20px;color:#1B4332;
     background:rgba(255,255,255,.72);border:1px solid rgba(27,67,50,.10);
     padding:10px 20px;border-radius:999px;white-space:nowrap}
</style>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="badge">
    <svg width="212" height="212" viewBox="0 0 212 212" xmlns="http://www.w3.org/2000/svg">
      <svg x="36" y="43" width="137" height="137" viewBox="0 -45 274 320">
        <path d="M137,260.3 Q131.52,150.7 137,82.2"
              fill="none" stroke="#FFFFFF" stroke-width="24.66" stroke-linecap="round"/>
        <path d="M137,115.08 Q200.29,51.79 137,0 Q73.71,51.79 137,115.08 Z"
              fill="#FFFFFF" transform="rotate(-38 137 115.08)"/>
        <path d="M137,93.16 Q206.32,23.84 137,-32.88 Q67.68,23.84 137,93.16 Z"
              fill="#FFFFFF" transform="rotate(32 137 93.16)"/>
      </svg>
    </svg>
  </div>
  <div class="copy">
    <h1>Listo</h1>
    <p class="tag">Make your list. The rest is easy.</p>
    <ul><li>Auto-sorted aisles</li><li>Plan by date</li><li>Free, no account</li></ul>
  </div>
</div>
